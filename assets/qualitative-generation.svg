<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="45" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#111827">Qualitative Improvements After DIVA</text>
  <g font-family="Arial">
    <rect x="70" y="90" width="380" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="260" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Spatial Layout</text>
    <rect x="105" y="170" width="135" height="145" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="172" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Baseline</text>
    <text x="172" y="250" text-anchor="middle" font-size="16" fill="#7f1d1d">object relation</text>
    <text x="172" y="275" text-anchor="middle" font-size="16" fill="#7f1d1d">often missed</text>
    <rect x="280" y="170" width="135" height="145" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="348" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">DIVA</text>
    <text x="348" y="250" text-anchor="middle" font-size="16" fill="#14532d">layout</text>
    <text x="348" y="275" text-anchor="middle" font-size="16" fill="#14532d">preserved</text>
    <text x="260" y="370" text-anchor="middle" font-size="16" fill="#475569">Example: backpack below a cake</text>
    <rect x="510" y="90" width="380" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="700" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Multi-Object Control</text>
    <rect x="545" y="170" width="135" height="145" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="612" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Baseline</text>
    <text x="612" y="250" text-anchor="middle" font-size="16" fill="#7f1d1d">counts and</text>
    <text x="612" y="275" text-anchor="middle" font-size="16" fill="#7f1d1d">attributes blur</text>
    <rect x="720" y="170" width="135" height="145" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="788" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">DIVA</text>
    <text x="788" y="250" text-anchor="middle" font-size="16" fill="#14532d">objects</text>
    <text x="788" y="275" text-anchor="middle" font-size="16" fill="#14532d">separated</text>
    <text x="700" y="370" text-anchor="middle" font-size="16" fill="#475569">Example: three bears on motorcycles</text>
    <rect x="950" y="90" width="380" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1140" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Dense Attributes</text>
    <rect x="985" y="170" width="135" height="145" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="1052" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Baseline</text>
    <text x="1052" y="250" text-anchor="middle" font-size="16" fill="#7f1d1d">details</text>
    <text x="1052" y="275" text-anchor="middle" font-size="16" fill="#7f1d1d">omitted</text>
    <rect x="1160" y="170" width="135" height="145" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="1228" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">DIVA</text>
    <text x="1228" y="250" text-anchor="middle" font-size="16" fill="#14532d">fine-grained</text>
    <text x="1228" y="275" text-anchor="middle" font-size="16" fill="#14532d">grounding</text>
    <text x="1140" y="370" text-anchor="middle" font-size="16" fill="#475569">Example: cafe scene with objects and light</text>
  </g>
