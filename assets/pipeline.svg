<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="45" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">DIVA Post-Training Pipeline</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect x="55" y="110" width="230" height="260" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="170" y="150" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">1. Shared Anchor</text>
  <rect x="95" y="195" width="150" height="90" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="170" y="233" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">Image</text>
  <text x="170" y="258" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">Text Pair</text>
  <text x="170" y="330" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">same sample Y</text>
  <path d="M295 240 L360 240" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="370" y="95" width="250" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="495" y="135" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">2. Two Flows</text>
  <rect x="415" y="175" width="160" height="58" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="495" y="211" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1e3a8a">Captioning</text>
  <rect x="415" y="282" width="160" height="58" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="495" y="318" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#14532d">Inpainting</text>
  <text x="495" y="372" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">middle-layer states</text>
  <path d="M630 240 L695 240" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="705" y="95" width="290" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="850" y="135" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">3. Factorization</text>
  <rect x="750" y="180" width="200" height="58" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="850" y="216" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#075985">Shared Space</text>
  <rect x="750" y="285" width="200" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="850" y="321" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#78350f">Unique Space</text>
  <text x="850" y="372" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">gated MLP encoders</text>
  <path d="M1005 240 L1070 240" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1080" y="95" width="270" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1215" y="135" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">4. Mutual Training</text>
  <rect x="1118" y="175" width="195" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1215" y="211" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#14532d">maximize shared MI</text>
  <rect x="1118" y="282" width="195" height="58" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1215" y="318" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">minimize leakage</text>
  <text x="1215" y="372" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">post-train the UMM backbone</text>
</svg>
